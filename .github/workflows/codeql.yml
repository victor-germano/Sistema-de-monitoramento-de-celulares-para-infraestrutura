name: CodeQL

# Análise estática de segurança (SQL injection, XSS, path traversal, etc.) —
# diferente do `npm audit` (que olha vulnerabilidade conhecida em dependência
# de terceiro): o CodeQL varre o NOSSO código em busca do padrão de bug, não
# só o nome do pacote. Roda em todo push/PR na main e, mesmo sem mudança
# nenhuma, uma vez por semana (uma CVE nova pode afetar código que não mudou).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC

jobs:
  analyze:
    name: Análise CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # `upload: false` + artefato em vez de upload direto pro GitHub: a
      # integração nativa (aba Security → Code scanning) exige essa feature
      # habilitada nas configurações do repositório — em repositório PRIVADO
      # isso pode depender de plano pago (GitHub Advanced Security), decisão
      # de conta que não é nossa pra tomar sozinha. Enquanto isso não for
      # decidido/habilitado manualmente (Settings → Code security and
      # analysis), o resultado fica disponível como artefato do workflow, não
      # perdido — ver docs/OPERACAO.md.
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: false
          output: sarif-results

      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
