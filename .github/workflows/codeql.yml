name: CodeQL

# Análise estática de segurança (SQL injection, XSS, path traversal, etc.) —
# diferente do `npm audit` (que olha vulnerabilidade conhecida em dependência
# de terceiro): o CodeQL varre o NOSSO código em busca do padrão de bug, não
# só o nome do pacote. Roda em todo push/PR na main e, mesmo sem mudança
# nenhuma, uma vez por semana (uma CVE nova pode afetar código que não mudou).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC

jobs:
  analyze:
    name: Análise CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
