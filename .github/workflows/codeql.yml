name: CodeQL

# Análise estática de segurança (SQL injection, XSS, path traversal, etc.) —
# diferente do `npm audit` (que olha vulnerabilidade conhecida em dependência
# de terceiro): o CodeQL varre o NOSSO código em busca do padrão de bug, não
# só o nome do pacote. Roda em todo push/PR na main e, mesmo sem mudança
# nenhuma, uma vez por semana (uma CVE nova pode afetar código que não mudou).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC

jobs:
  analyze:
    name: Análise CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # Repositório tornou-se público em 2026-10-16 — "Code scanning" nativo
      # (aba Security) é gratuito em repositório público, diferente de antes
      # (privado, poderia exigir GitHub Advanced Security pago). Upload
      # direto reativado; sem mais artefato redundante.
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
